server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bomerp-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: bomerp-backend
          application: bomerp-backend
          environment: dev
          __path__: /var/log/bomerp-backend/*.log
